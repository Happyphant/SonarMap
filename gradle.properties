# JVM settings for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin/Compose
kotlin.code.style=official

# Non-transitive R classes build the app faster
android.nonTransitiveRClass=true

# Compose compiler 2.1.0 has an incremental-cache bug that throws
# "NotImplementedError: Unknown file" on edited Kotlin files; the code is
# fine and a clean build passes. Disable incremental compilation until the
# toolchain is upgraded past the bug.
kotlin.incremental=false
